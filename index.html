<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>QuoteX — Daily Wisdom & Random Quote Generator</title>

		<meta
			name="description"
			content="QuoteX is a minimalist random quote generator offering curated wisdom from philosophers, poets, and leaders. Filter by category, copy, and share inspiring quotes." />
		<meta
			name="keywords"
			content="quote generator, random quotes, daily wisdom, inspirational quotes, philosophy quotes, famous quotes, quote of the day, share quotes" />
		<meta name="author" content="Sakyi" />
		<meta name="robots" content="index, follow" />
		<meta name="theme-color" content="#f5f0e8" />
		<link rel="canonical" href="https://quotex.example.com/" />

		<!-- Open Graph / Facebook -->
		<meta property="og:type" content="website" />
		<meta
			property="og:title"
			content="QuoteX — Daily Wisdom & Random Quote Generator" />
		<meta
			property="og:description"
			content="Discover curated quotes from philosophers, poets, and leaders. Filter by theme, copy, and share inspiration daily." />
		<meta property="og:site_name" content="QuoteX" />
		<meta property="og:url" content="https://quotex.example.com/" />
		<meta
			property="og:image"
			content="https://quotex.example.com/og-image.png" />

		<!-- Twitter -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta
			name="twitter:title"
			content="QuoteX — Daily Wisdom & Random Quote Generator" />
		<meta
			name="twitter:description"
			content="Discover curated quotes from philosophers, poets, and leaders. Filter by theme, copy, and share inspiration daily." />
		<meta
			name="twitter:image"
			content="https://quotex.example.com/og-image.png" />

		<link
			rel="icon"
			type="image/svg+xml"
			href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231a1614'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='20' fill='%23f5f0e8' text-anchor='middle'%3EX%3C/text%3E%3C/svg%3E" />

		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "WebApplication",
				"name": "QuoteX",
				"headline": "Daily Wisdom & Random Quote Generator",
				"description": "A minimalist random quote generator offering curated wisdom from philosophers, poets, and leaders, with category filtering and sharing.",
				"url": "https://quotex.example.com/",
				"applicationCategory": "LifestyleApplication",
				"operatingSystem": "Any",
				"author": {
					"@type": "Person",
					"name": "Daniel Yirenkyi"
				},
				"offers": {
					"@type": "Offer",
					"price": "0",
					"priceCurrency": "USD"
				}
			}
		</script>

		<link rel="stylesheet" href="style.css" />
		<link rel="manifest" href="manifest.webmanifest" />
		<meta name="theme-color" content="#f5f0e8" />
		<link
			href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=DM+Sans:wght@300;400;500&display=swap"
			rel="stylesheet" />
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
			crossorigin="anonymous"
			referrerpolicy="no-referrer" />
	</head>
	<body>
		<header>
			<div class="masthead">Quote<span>X</span></div>
			<div class="issue-label">Daily wisdom edition</div>
		</header>

		<main>
			<section class="quote-stage" id="quoteStage">
				<div class="category-tag" id="categoryTag">Philosophy</div>
				<div class="opening-mark">&ldquo;</div>
				<p class="quote-text" id="quoteText">
					The unexamined life is not worth living.
				</p>
				<div class="attribution-row">
					<div class="attr-line"></div>
					<div>
						<div class="author-name" id="authorName">Socrates</div>
						<div class="author-bio" id="authorBio">
							Greek philosopher, 470–399 BC
						</div>
					</div>
				</div>
			</section>

			<aside class="sidebar">
				<button class="btn-new" id="newQuoteBtn">
					<i class="fa fa-refresh" aria-hidden="true"></i>
					New Quote
				</button>

				<div>
					<div class="filter-label">Filter by category</div>
					<div class="category-filters" id="categoryFilters"></div>
				</div>

				<div class="divider"></div>

				<div class="share-section">
					<div class="filter-label" style="margin-bottom: 0.75rem">
						Share quote
					</div>
					<div class="share-row">
						<button class="share-btn" id="copyBtn">Copy text</button>
						<button class="share-btn" id="tweetBtn">Twitter</button>
					</div>
				</div>

				<div class="counter-strip">
					<div class="counter-label">Quotes explored</div>
					<div class="counter-num" id="counter">1 <span>of 30</span></div>
				</div>
			</aside>
		</main>

		<footer>
			<div class="footer-text">Curated wisdom &mdash; refreshed daily</div>
			<div class="progress-bar">
				<div class="progress-fill" id="progressFill" style="width: 3.3%"></div>
			</div>
		</footer>

		<div class="toast" id="toast">Copied to clipboard!</div>
		<script src="script.js"></script>
	</body>
</html>
